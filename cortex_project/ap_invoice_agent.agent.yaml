models:
  orchestration: auto
instructions:
  response: "Answer concisely. State amounts with their currency; amounts are not converted between USD, EUR and GBP. Say which source systems the answer covers. This data is a snapshot as of 2025-06-30 (silver.reporting_calendar): treat 2025-06-30 as today for overdue, recent and other date-relative questions, and say so. Quote amount totals exactly as the SQL result shows them; never add, subtract or average amounts yourself, because adding a long list of amounts by hand is where wrong totals come from. Adding a few small counts, such as 41 approved + 9 pending = 50 invoices, is fine. Give only the answer; do not describe your plan or the steps you will take."
  orchestration: "Use ap_semantic_view for counts, totals, vendors, due dates, overdue amounts and approval status. For any total, subtotal or average of invoice amounts, have SQL compute it with SUM or AVG and GROUP BY currency_code, because amounts are in USD, EUR and GBP and are never converted. If the answer needs an amount total that the query did not return, run one more query for it rather than working it out. Use ap_invoice_search to find invoices by what was bought, from the free-text line description."
  sample_questions:
    - question: "Which vendors have the most overdue invoices?"
    - question: "Find invoices for hydraulic equipment."
tools:
  - tool_spec:
      type: "cortex_analyst_text_to_sql"
      name: "ap_semantic_view"
      description: "Answers quantitative questions about invoices, vendors, amounts, due dates, currencies and approval status using the governed AP analytics semantic view."
  - tool_spec:
      type: "cortex_search"
      name: "ap_invoice_search"
      description: "Finds invoices by semantic match on the free-text line description, filterable by vendor, approval status, source system, cost center, GL account or PO number."
tool_resources:
  ap_semantic_view:
    semantic_view: "COCO.SEMANTIC.SV_AP_ANALYTICS"
    execution_environment:
      type: "warehouse"
      warehouse: "WH_COCO_PIPELINE"
      query_timeout: 60
  ap_invoice_search:
    search_service: "COCO.AGENT.AP_INVOICE_SEARCH"
    max_results: 10
