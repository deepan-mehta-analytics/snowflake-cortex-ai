# Offline CI: lint + unit tests on every push and pull request (no secrets, no Snowflake).
name: CI

# Run on every push and every pull request.
on:
  push:
  pull_request:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

jobs:
  # Single offline job: lint, then unit tests.
  offline:
    # GitHub-hosted Linux runner.
    runs-on: ubuntu-26.04        # pinned: last CI run passed on 26.04; never ubuntu-latest (guard job)
    # Fail fast if anything hangs; the suite takes seconds.
    timeout-minutes: 10
    steps:
      # Fetch the repository.
      - uses: actions/checkout@v5
      # Same Python as local development (3.11), with pip download cache.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # Dev requirements include requests, the connector (imported by native_eval), pytest, ruff, pyyaml.
      - run: pip install -r requirements-dev.txt
      # Lint with the pinned ruff.
      - run: ruff check .
      # Offline tests only (tests/ never touches the network).
      - run: pytest tests/ -v

  # ── Runner pin guard ────────────────────────────────────────────────────
  # ubuntu-latest moved from 24.04 to 26.04 in Oct-Nov 2026 and broke an R
  # build in another repo. Every job must name an exact image; this job fails
  # if any workflow uses a moving "-latest" runner label.
  runner-pin-guard:
    name: Runner pin guard                                   # label shown in the Actions UI
    runs-on: ubuntu-26.04        # pinned: last CI run passed on 26.04; never ubuntu-latest (guard job)
    steps:
      - uses: actions/checkout@v5                                     # check out the workflow files
      - name: Fail on moving runner labels                   # the fail-safe check
        run: |                                               # bash step
          echo "::notice::Runner image $ImageOS $ImageVersion"   # record which image ran
          if grep -rnE '^[^#]*(ubuntu|windows|macos)-latest' .github/workflows; then  # any -latest label outside a comment (runs-on or matrix)?
            echo "::error::Pin runners to an exact image (e.g. ubuntu-24.04), never *-latest"   # explain the failure
            exit 1                                           # fail the job
          fi                                                 # end of check
